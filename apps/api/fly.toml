# Fly.io config for the PickupVB API. Run `fly launch` once to create the app,
# then `fly deploy` (or push to main) to ship.
app = "pickupvb-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
