<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pickup volleyball">
  <title>Pickup volleyball — option B (net + ball)</title>
  <!-- Delight #1 (docs/delight-backlog.md): the ball hops once when the favicon
       first loads. CSS (not SMIL) so a reduced-motion request silences it, and
       so the static rasterization (t=0 = ball at rest) stays correct. Chrome /
       Firefox animate SVG favicons; Safari renders the resting frame. -->
  <style>
    .ball { transform-box: fill-box; transform-origin: center; animation: pvb-hop 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 1 both; }
    @keyframes pvb-hop { 0%, 100% { transform: translateY(0); } 28% { transform: translateY(-7px); } 60% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
  </style>
  <rect width="64" height="64" rx="14" fill="#F9EBD9"/>
  <!-- Ball -->
  <circle class="ball" cx="32" cy="24" r="10" fill="none" stroke="#439093" stroke-width="3"/>
  <!-- Net -->
  <line x1="8"  y1="44" x2="56" y2="44" stroke="#183334" stroke-width="3" stroke-linecap="round"/>
  <!-- Net posts on each end (flush with top net line, extend below the mesh) -->
  <line x1="8"  y1="44" x2="8"  y2="58" stroke="#183334" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="44" x2="56" y2="58" stroke="#183334" stroke-width="3" stroke-linecap="round"/>
  <!-- Net mesh hint -->
  <g stroke="#183334" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <line x1="14" y1="44" x2="14" y2="53"/>
    <line x1="20" y1="44" x2="20" y2="53"/>
    <line x1="26" y1="44" x2="26" y2="53"/>
    <line x1="32" y1="44" x2="32" y2="53"/>
    <line x1="38" y1="44" x2="38" y2="53"/>
    <line x1="44" y1="44" x2="44" y2="53"/>
    <line x1="50" y1="44" x2="50" y2="53"/>
    <line x1="8"  y1="49" x2="56" y2="49"/>
    <line x1="8"  y1="53" x2="56" y2="53"/>
  </g>
</svg>
