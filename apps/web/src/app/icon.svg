<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pickup volleyball">
  <title>Pickup volleyball — option B (net + ball)</title>
  <rect width="64" height="64" rx="14" fill="#F9EBD9"/>
  <!-- Ball -->
  <circle cx="32" cy="24" r="10" fill="none" stroke="#439093" stroke-width="3"/>
  <!-- Net -->
  <line x1="8"  y1="44" x2="56" y2="44" stroke="#183334" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="58" stroke="#183334" stroke-width="3" stroke-linecap="round"/>
  <!-- Net mesh hint -->
  <g stroke="#183334" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <line x1="14" y1="44" x2="14" y2="52"/>
    <line x1="20" y1="44" x2="20" y2="52"/>
    <line x1="26" y1="44" x2="26" y2="52"/>
    <line x1="38" y1="44" x2="38" y2="52"/>
    <line x1="44" y1="44" x2="44" y2="52"/>
    <line x1="50" y1="44" x2="50" y2="52"/>
    <line x1="8"  y1="48" x2="56" y2="48"/>
    <line x1="8"  y1="52" x2="56" y2="52"/>
  </g>
</svg>
