name: Feature request
description: Suggest a new capability, refinement, or workflow improvement for pickupvb.com.
title: 'Feature: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Concrete user scenarios
        ("when I'm doing X, I want Y") help much more than abstract wishlists.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current friction or gap, not the solution.
      placeholder: |
        When I'm setting up a tournament with multiple divisions, I have to
        click into each division to set the same start time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketches / mockups / wireframes welcome.
      placeholder: |
        Add a "copy start time to all divisions" button on the divisions tab.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they didn't fit.

  - type: dropdown
    id: surface
    attributes:
      label: Which part of the product?
      description: Roughly where in the app does this live? Pick the closest match.
      options:
        - Events (create / view / RSVP)
        - Tournaments (brackets / divisions)
        - Groups (members / co-hosts)
        - Profile / billing
        - Notifications (email / push / reminders)
        - Search / discovery
        - Marketing pages
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: who
    attributes:
      label: Who benefits?
      description: Hosts, attendees, free agents, captains, anonymous viewers, …
      placeholder: Tournament hosts running 4+ divisions.

  - type: textarea
    id: extras
    attributes:
      label: Anything else?
      description: Related issues, screenshots, links, examples from other products.
