name: Supabase Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to push migrations to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

concurrency:
  # Serialize per-branch so prod and dev pushes don't queue behind each other.
  group: supabase-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Selects per-environment secrets (SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD)
    # from the matching GitHub Environment. Create `production` and `development`
    # environments under repo Settings → Environments before pushing to `develop`.
    environment: ${{ (github.ref_name == 'develop' || github.event.inputs.environment == 'development') && 'development' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          # Pin a concrete version. `version: latest` makes the action query the
          # GitHub releases API to resolve "latest", which hits the anonymous
          # rate limit on shared runners ("Failed to resolve latest Supabase CLI
          # release: rate limit exceeded"). A pinned version skips that call.
          # Bump deliberately; keep in sync with the local CLI and the
          # `supabase` devDependency in package.json (^2.98.2).
          version: 2.102.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push
