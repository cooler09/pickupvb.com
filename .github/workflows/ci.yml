name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage
            apps/*/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        # The Supabase env vars below are deliberate placeholders, not real
        # secrets. `next build` validates that `NEXT_PUBLIC_SUPABASE_URL` /
        # `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY` are present at build time
        # (the Supabase browser client throws on import otherwise), but no
        # request actually hits Supabase during the build. Real-Supabase
        # validation is intentionally deferred to `smoke-prod.yml`, which
        # runs Playwright against the deployed Vercel preview/prod URL after
        # deploy — that's where any actual schema or auth regression would
        # surface. Wiring a real CI Supabase here would cost shared quota
        # and a service-role secret without catching anything the post-deploy
        # smoke doesn't already catch. See docs/audits/organization.md
        # "CI uses hardcoded Supabase placeholder keys" (closed Bundle 58).
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
