# Supabase local dev configuration.
project_id = "pickupvb"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://pickupvb.com/auth/callback"]
jwt_expiry = 3600
enable_signup = true
# Required for the guest RSVP / guest ticket-checkout / anonymous tip flows
# (supabase.auth.signInAnonymously() in guest-actions.ts, checkout-actions.ts,
# tip-actions.ts). Without this the call returns "Anonymous sign-ins are
# disabled" and every guest signup path fails. Mirror this toggle in the
# Supabase dashboard for staging + prod (Auth → Providers → Anonymous).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google OAuth — used by the "Continue with Google" button on /login.
# Client ID / secret come from Google Cloud Console (APIs & Services →
# Credentials → OAuth 2.0 Client IDs). Authorized redirect URI on the
# Google side must be http://127.0.0.1:54321/auth/v1/callback for local
# and https://<project-ref>.supabase.co/auth/v1/callback for hosted.
# Mirror this provider in the Supabase dashboard (Auth → Providers →
# Google) for staging + prod.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
# Leave skip_nonce_check at default (false) unless you hit nonce errors
# during PKCE — Supabase handles the nonce for us.

[realtime]
enabled = true
